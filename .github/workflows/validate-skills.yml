name: validate-skills

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Validate every SKILL.md has correct frontmatter
        run: python tools/validate_skills.py

      - name: Validate JSON schemas
        run: python tools/validate_schemas.py

      - name: Validate brand-pack template parses
        run: python tools/validate_brand_lock.py brand-packs/_template.md

      - name: Validate generator capability matrix
        run: python tools/validate_capabilities.py

      - name: Validate critique gate (selftest, then example fixtures)
        run: |
          python tools/validate_critique.py --selftest
          python tools/validate_critique.py \
            skills/visual-asset-critic/examples/critique.accept.json \
            skills/visual-asset-critic/examples/critique.revise.json
